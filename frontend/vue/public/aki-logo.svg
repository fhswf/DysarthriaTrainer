          fill="none" stroke-linecap="round"/>
    <path d="M 9 5 Q 16 0, 16 12 Q 16 24, 9 19"
          stroke="#F59E0B" stroke-width="2.7"
          fill="none" stroke-linecap="round"/>
  </g>

  <!-- Musical note -->
  <g transform="translate(60, 16)">
    <line x1="0" y1="0" x2="0" y2="20"
          stroke="#1E40AF" stroke-width="2.4"
          stroke-linecap="round"/>
    <path d="M 0 0 Q 7 3, 7 8 Q 6.5 6, 1 4"
          stroke="#1E40AF" stroke-width="2.4"
          fill="none" stroke-linecap="round"/>
    <ellipse cx="-3" cy="20" rx="5" ry="3.3"
             fill="#1E40AF"
             transform="rotate(-18 -3 20)"/>
  </g>

  <!-- Text: AKI -->
  <text x="88" y="28"
        font-family="'Inter','Segoe UI',sans-serif"
        font-size="20" font-weight="700"
        fill="#1F2937">
    AKI
  </text>

  <!-- Text: Sprachtraining -->
  <text x="88" y="46"
        font-family="'Inter','Segoe UI',sans-serif"
        font-size="14" font-weight="500"
        fill="#6B7280">
    Sprachtraining
  </text>

</svg>
