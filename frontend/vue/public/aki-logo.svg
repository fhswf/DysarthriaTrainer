<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Refined Human head profile outline -->
  <g transform="translate(0, 4) scale(0.32)">
    <path d="M100 20
             C84 18, 68 38, 63 60
             C60 75, 66 92, 74 104
             C70 121, 74 134, 88 142
             C98 148, 95 164, 96 175
             L128 175
             C126 164, 121 149, 132 142
             C146 134, 150 120, 147 104
             C156 90, 156 72, 150 58
             C145 40, 122 18, 100 20 Z"
          stroke="#1E40AF" stroke-width="7.5"
          fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Speech/Sound waves -->
  <g transform="translate(40, 24)">
    <path d="M 0 8 Q 6 4, 6 12 Q 6 20, 0 16"
